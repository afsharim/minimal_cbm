data:
  dataset: AWA2
  n_concepts: 20
  root: /research/hal-afsharim/minimal_cbm/data/awa2
model:
  beta: 0.1
  encoder:
    arch: resnet50
    hidden_dim: 1024
    pretrained: true
  hidden_dims_c: []
  hidden_dims_y: 256
  model_type: cem
  var_z: 0
training:
  batch_size: 128
  n_epochs: 2
  optimizer:
    base_batch_size: 64
    base_lr: 0.01
    batch_size: 128
    momentum: 0.9
    optimizer: SGD
    weight_decay: 4.0e-05
  save_epochs: 2
  scheduler:
    gamma: 0.1
    scheduler: StepLR
    step_size: 50
